[project]
name = "stardeck"
version = "2.5.0"
description = "Open-source, self-hosted AI dashboards for your database, powered by local LLMs."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "cryptography>=50.0.2",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
]

# Drivers for more databases. PostgreSQL, MySQL/MariaDB, SQLite and uploads need none of these.
[project.optional-dependencies]
sqlserver = ["pymssql>=2.3"]
oracle = ["oracledb>=2.0"]
clickhouse = ["clickhouse-connect>=0.8"]
duckdb = ["duckdb>=1.1", "duckdb-engine>=0.13"]
trino = ["trino>=0.330"]
snowflake = ["snowflake-sqlalchemy>=1.7"]
bigquery = ["sqlalchemy-bigquery>=1.12"]
databricks = ["databricks-sqlalchemy>=2.0"]
all = ["stardeck[sqlserver,oracle,clickhouse,duckdb,trino,snowflake,bigquery,databricks]"]

[project.urls]
Homepage = "https://github.com/Artechie0806/Stardeck"
Issues = "https://github.com/Artechie0806/Stardeck/issues"
Changelog = "https://github.com/Artechie0806/Stardeck/blob/main/CHANGELOG.md"

[project.scripts]
stardeck-admin = "stardeck.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stardeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

