server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 200m;  # CSV/Excel uploads (matches STARDECK_MAX_UPLOAD_MB)

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 600s;
    proxy_buffering off;  # dashboard generation streams progress events
    # The visitor's real address (sign-in rate limits are per address) and scheme.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri /index.html; }
}
